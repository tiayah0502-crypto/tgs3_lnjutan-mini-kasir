
name: Build EXE Kasir

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile Static EXE
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ main.cpp -o kasir.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KASIR-EXE
          path: kasir.exe

