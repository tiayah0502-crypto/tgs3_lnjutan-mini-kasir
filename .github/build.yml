name: Build Mini Kasir

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile C++
        run: |
          g++ -std=c++17 main.cpp -o mini-kasir
          mkdir -p hasil
          cp mini-kasir hasil/mini-kasir

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-kasir
          path: hasil/mini-kasir
          if-no-files-found: error
          retention-days: 7
