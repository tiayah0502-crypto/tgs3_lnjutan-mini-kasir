name: Build Mini Kasir

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Find C++ file
        id: source
        shell: bash
        run: |
          FILE=$(find . -maxdepth 2 -type f -name '*.cpp' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File C++ tidak ditemukan!"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "File ditemukan: $FILE"

      - name: Compile program
        run: |
          g++ -std=c++17 "${{ steps.source.outputs.file }}" -o mini-kasir
          mkdir -p hasil
          cp mini-kasir hasil/mini-kasir

      - name: Verify output
        run: |
          test -f hasil/mini-kasir
          ls -lh hasil/mini-kasir

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-kasir
          path: hasil/mini-kasir
          if-no-files-found: error
          retention-days: 7
