name: Build Mini Kasir

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Check source file
        run: |
          find . -maxdepth 3 -type f -name "*.cpp"

      - name: Compile program
        shell: bash
        run: |
          SOURCE=$(find . -maxdepth 3 -type f -name "*.cpp" ! -path "./.git/*" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "File C++ tidak ditemukan."
            exit 1
          fi

          echo "Mengompilasi: $SOURCE"
          g++ -std=c++17 "$SOURCE" -o mini-kasir

      - name: Prepare artifact
        run: |
          mkdir -p hasil
          cp mini-kasir hasil/mini-kasir
          ls -lh hasil/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-kasir
          path: hasil/mini-kasir
          if-no-files-found: error
          retention-days: 7
