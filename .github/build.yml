
name: Build Mini Kasir

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build EXE
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 main.cpp -o MiniKasir.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MiniKasir-Windows
          path: MiniKasir.exe

