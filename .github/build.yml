
name: Build EXE Kasir

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build EXE
        shell: msys2 {0}
        run: |
          g++ -std=c++17 main.cpp -o kasir.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KASIR-EXE
          path: kasir.exe


